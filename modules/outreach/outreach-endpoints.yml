    name: ${self:service}-me-unpublish-moment
    events:
      - http:
          path: me/moments/{id}/unpublish
          method: post
          cors: true

  # ── Parent / student app feed (student token + X-Student-Id) ───────────────
  me-feed:
    handler: outreach-me-handler.feed
    name: ${self:service}-me-feed
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/feed
          method: get
          cors: true

  me-feed-moment:
    handler: outreach-me-handler.getFeedMoment
    name: ${self:service}-me-feed-moment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/feed/{id}
          method: get
          cors: true

  me-feed-reaction:
