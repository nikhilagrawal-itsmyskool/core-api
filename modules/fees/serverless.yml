provider:
  name: aws
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  environment:
    ${file(../../configs/${self:provider.stage}/${self:provider.stage}.yml)}
  $<<: ${file(../global-config-${self:provider.stage}.yml):provider}

custom:
  prefix: itsmyskool
  baseServiceName: fees-service
  fullServiceName: ${self:custom.prefix}-${self:custom.baseServiceName}
  customDomain:
   basePath: 'fees'
  authorizerExtraExempt:
    - 'verify/receipt/{uuid}'   # public receipt verification (QR scan) — no JWT
  # The fees service crossed CloudFormation's 500-resource/stack limit; split each function into
  # its own nested stack (same fix the assembly module uses).
  splitStacks:
    perFunction: true
    perType: false
    perGroupFunction: false
  $<<: ${file(../global-config-${self:provider.stage}.yml):custom}

service: ${self:provider.stage}-${self:custom.fullServiceName}
configValidationMode: off

plugins:
  - ../../plugins/serverless-merge-config.js
  - serverless-webpack
  - serverless-offline
  - serverless-domain-manager
  - ../../plugins/serverless-cors-defaults.js
  - ../../plugins/serverless-authorizer.js
  - serverless-plugin-split-stacks

functions: ${file(fees-endpoints.yml)}

$<<: ${file(../global-config-${self:provider.stage}.yml):resources}
