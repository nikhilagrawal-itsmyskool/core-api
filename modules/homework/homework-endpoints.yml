          cors: true

  set-class-teacher:
    handler: homework-handler.setClassTeacher
    name: ${self:service}-set-class-teacher
    events:
      - http:
          path: class-teachers/{classId}
          method: put
          cors: true

  clear-class-teacher:
    handler: homework-handler.clearClassTeacher
    name: ${self:service}-clear-class-teacher
    events:
      - http:
          path: class-teachers/{classId}
          method: delete
          cors: true

  get-audit:
    handler: homework-handler.getAudit
    name: ${self:service}-get-audit
    events:
      - http:
          path: audit
          method: get
          cors: true

  # ── Teacher PWA (resolveEmployee, scoped by canPostForClass) ───────────────
  me-classes:
    handler: homework-me-handler.myClasses
    name: ${self:service}-me-classes
    events:
      - http:
          path: me/classes
          method: get
          cors: true

  me-get-day:
    handler: homework-me-handler.getDay
    name: ${self:service}-me-get-day
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/day
          method: get
          cors: true

  me-ensure-day:
    handler: homework-me-handler.ensureDay
    name: ${self:service}-me-ensure-day
    events:
      - http:
          path: me/day
          method: post
          cors: true

  me-publish-day:
    handler: homework-me-handler.publish
    name: ${self:service}-me-publish-day
    events:
      - http:
          path: me/day/{id}/publish
          method: post
          cors: true

  me-unpublish-day:
    handler: homework-me-handler.unpublish
    name: ${self:service}-me-unpublish-day
    events:
      - http:
          path: me/day/{id}/unpublish
          method: post
          cors: true

  me-add-item:
    handler: homework-me-handler.addItem
    name: ${self:service}-me-add-item
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/items
          method: post
          cors: true

  me-edit-item:
    handler: homework-me-handler.editItem
    name: ${self:service}-me-edit-item
    events:
      - http:
          path: me/items/{id}
          method: put
          cors: true

  me-remove-item:
    handler: homework-me-handler.removeItem
    name: ${self:service}-me-remove-item
    events:
      - http:
          path: me/items/{id}
          method: delete
          cors: true

  me-get-item-image:
    handler: homework-me-handler.getItemImage
    name: ${self:service}-me-get-item-image
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/items/{id}/image
          method: get
          cors: true

  # ── Student/parent app (family token + X-Student-Id) ───────────────────────
  me-today:
    handler: homework-me-handler.studentToday
    name: ${self:service}-me-today
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/today
          method: get
          cors: true

  me-history:
    handler: homework-me-handler.studentHistory
    name: ${self:service}-me-history
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/history
          method: get
          cors: true

  # ── Word→PDF conversion worker (docx -> pdf) ───────────────────────────────
  # Heavy LibreOffice layer is isolated to these functions only; every CRUD endpoint
  # above stays light (512 MB, no layer). Mirrors the syllabus model-paper worker.
  # HTTP entrypoint for the local poller (scripts/local/homework-conversion-worker.js).
  process-next-conversion:
    handler: homework-conversion-handler.processNext
    name: ${self:service}-process-next-conversion
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:2
    events:
      - http:
          path: conversions/process-next
          method: post
          cors: true

  # AWS worker: EventBridge drains pending Word items to PDF every minute. Overlap-safe
  # via `for update skip locked`; inert while HOMEWORK_CONVERT_ENABLED is not 'true'.
  drain-conversions:
    handler: homework-conversion-handler.drain
    name: ${self:service}-drain-conversions
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:2
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true

  # Invoke-only runtime check for the LibreOffice layer (AL2 binary on AL2023).
  # Run: serverless invoke -f convert-selftest --stage prod --region ap-south-1
  convert-selftest:
    handler: homework-conversion-handler.selftest
    name: ${self:service}-convert-selftest
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:2
