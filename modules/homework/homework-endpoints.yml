  # Health check
  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # ── Admin/teacher: the day's homework (X-School-Code + JWT) ────────────────
  get-day:
    handler: homework-handler.getDay
    name: ${self:service}-get-day
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: day
          method: get
          cors: true

  ensure-day:
    handler: homework-handler.ensureDay
    name: ${self:service}-ensure-day
    events:
      - http:
          path: day
          method: post
          cors: true

  publish-day:
    handler: homework-handler.publish
    name: ${self:service}-publish-day
    events:
      - http:
          path: day/{id}/publish
          method: post
          cors: true

  unpublish-day:
    handler: homework-handler.unpublish
    name: ${self:service}-unpublish-day
    events:
      - http:
          path: day/{id}/unpublish
          method: post
          cors: true

  add-item:
    handler: homework-handler.addItem
    name: ${self:service}-add-item
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: items
          method: post
          cors: true

  edit-item:
    handler: homework-handler.editItem
    name: ${self:service}-edit-item
    events:
      - http:
          path: items/{id}
          method: put
          cors: true

  remove-item:
    handler: homework-handler.removeItem
    name: ${self:service}-remove-item
    events:
      - http:
          path: items/{id}
          method: delete
          cors: true

  get-item-image:
    handler: homework-handler.getItemImage
    name: ${self:service}-get-item-image
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: items/{id}/image
          method: get
          cors: true

  # ── Postable classes (base + stream children) for the pickers ──────────────
  list-classes:
    handler: homework-handler.listClasses
    name: ${self:service}-list-classes
    events:
      - http:
          path: classes
          method: get
          cors: true

  # ── Admin: class → class-teacher mapping override ──────────────────────────
  class-teacher-map:
    handler: homework-handler.classTeacherMap
    name: ${self:service}-class-teacher-map
    events:
      - http:
          path: class-teachers
