  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # ---- Student search / list ----
  search-student:
    handler: student-handler.search
    name: ${self:service}-search-student
    # withPhotos presigns an S3 URL per row (SigV4 = CPU); give this more memory
    # (⇒ more CPU) and headroom over the 160MB/10s default so signing stays fast.
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: search
          method: get
          cors: true

  omni-search:
    handler: student-handler.omni
    name: ${self:service}-omni-search
    events:
      - http:
          path: omni-search
          method: get
          cors: true

  # Per-class active strength + last admission for an academic year (default: current)
  class-strength:
    handler: student-handler.classStrength
    name: ${self:service}-class-strength
    events:
      - http:
          path: class-strength
          method: get
          cors: true

  list-students:
    handler: student-admin-handler.list
    name: ${self:service}-list-students
    events:
      - http:
          path: ''
          method: get
          cors: true

  create-student:
    handler: student-admin-handler.create
    name: ${self:service}-create-student
    events:
      - http:
          path: ''
          method: post
          cors: true

  # ---- Houses (declared before students/{id} so the literal wins) ----
  list-houses:
    handler: house-handler.list
    name: ${self:service}-list-houses
    events:
      - http:
          path: houses
          method: get
          cors: true

  create-house:
    handler: house-handler.create
    name: ${self:service}-create-house
    events:
      - http:
          path: houses
          method: post
          cors: true

  get-house:
    handler: house-handler.getById
    name: ${self:service}-get-house
    events:
      - http:
          path: houses/{id}
          method: get
          cors: true

  update-house:
    handler: house-handler.update
    name: ${self:service}-update-house
    events:
      - http:
          path: houses/{id}
          method: put
          cors: true

  delete-house:
    handler: house-handler.remove
    name: ${self:service}-delete-house
    events:
      - http:
          path: houses/{id}
          method: delete
          cors: true

  # ---- Lookups (per-school reference data) ----
  list-lookups:
    handler: student-lookup-handler.list
    name: ${self:service}-list-lookups
    events:
      - http:
          path: lookups
          method: get
          cors: true

  create-lookup:
    handler: student-lookup-handler.create
    name: ${self:service}-create-lookup
    events:
      - http:
          path: lookups
          method: post
          cors: true

  suggest-pincode:
    handler: student-lookup-handler.suggestByPincode
    name: ${self:service}-suggest-pincode
    events:
      - http:
          path: lookups/pincode/{pincode}
          method: get
          cors: true

  update-lookup:
    handler: student-lookup-handler.update
    name: ${self:service}-update-lookup
    events:
      - http:
          path: lookups/{id}
          method: put
          cors: true

  delete-lookup:
    handler: student-lookup-handler.remove
    name: ${self:service}-delete-lookup
    events:
      - http:
          path: lookups/{id}
          method: delete
          cors: true

  # ---- Photos (student | guardian) ----
  upload-photo:
    handler: student-photo-handler.upload
    name: ${self:service}-upload-photo
    events:
      - http:
          path: photos/{entityType}/{entityId}
          method: post
          cors: true

  get-photo:
    handler: student-photo-handler.get
    name: ${self:service}-get-photo
    events:
      - http:
          path: photos/{entityType}/{entityId}
          method: get
          cors: true

  delete-photo:
    handler: student-photo-handler.remove
    name: ${self:service}-delete-photo
    events:
      - http:
          path: photos/{entityType}/{entityId}
          method: delete
          cors: true

  # ---- Promotion lifecycle ----
  promote:
    handler: promotion-handler.promote
    name: ${self:service}-promote
    events:
      - http:
          path: promote
          method: post
          cors: true

  promote-class:
    handler: promotion-handler.promoteClass
    name: ${self:service}-promote-class
    events:
      - http:
          path: promote-class
          method: post
          cors: true

  graduate:
    handler: promotion-handler.graduate
    name: ${self:service}-graduate
    events:
      - http:
          path: graduate
          method: post
          cors: true

  # ---- Guardians (nested under a student) ----
  list-guardians:
    handler: student-guardian-handler.list
    name: ${self:service}-list-guardians
    events:
      - http:
          path: '{id}/guardians'
          method: get
          cors: true

  create-guardian:
    handler: student-guardian-handler.create
    name: ${self:service}-create-guardian
    events:
      - http:
          path: '{id}/guardians'
          method: post
          cors: true

  update-guardian:
    handler: student-guardian-handler.update
    name: ${self:service}-update-guardian
    events:
      - http:
          path: '{id}/guardians/{guardianId}'
          method: put
          cors: true

  delete-guardian:
    handler: student-guardian-handler.remove
    name: ${self:service}-delete-guardian
    events:
      - http:
          path: '{id}/guardians/{guardianId}'
          method: delete
          cors: true

  # ---- Addresses (nested under a student) ----
  list-addresses:
    handler: student-address-handler.list
    name: ${self:service}-list-addresses
    events:
      - http:
          path: '{id}/addresses'
          method: get
          cors: true

  create-address:
    handler: student-address-handler.create
    name: ${self:service}-create-address
    events:
      - http:
          path: '{id}/addresses'
          method: post
          cors: true

  update-address:
    handler: student-address-handler.update
    name: ${self:service}-update-address
    events:
      - http:
          path: '{id}/addresses/{addressId}'
          method: put
          cors: true

  delete-address:
    handler: student-address-handler.remove
    name: ${self:service}-delete-address
    events:
      - http:
          path: '{id}/addresses/{addressId}'
          method: delete
          cors: true

  # ---- Siblings (nested under a student) ----
  list-siblings:
    handler: student-sibling-handler.list
    name: ${self:service}-list-siblings
    events:
      - http:
          path: '{id}/siblings'
          method: get
          cors: true

  create-sibling:
    handler: student-sibling-handler.create
    name: ${self:service}-create-sibling
    events:
      - http:
          path: '{id}/siblings'
          method: post
          cors: true

  delete-sibling:
    handler: student-sibling-handler.remove
    name: ${self:service}-delete-sibling
    events:
      - http:
          path: '{id}/siblings/{siblingId}'
          method: delete
          cors: true

  # ---- Student login credentials (god/admin, gated in UI) ----
  get-student-credentials:
    handler: student-admin-handler.getCredentials
    name: ${self:service}-get-student-credentials
    events:
      - http:
          path: '{id}/credentials'
          method: get
          cors: true

  reset-student-password:
    handler: student-admin-handler.resetPassword
    name: ${self:service}-reset-student-password
    events:
      - http:
          path: '{id}/reset-password'
          method: post
          cors: true

  # ---- House assignment for a student ----
  assign-house:
    handler: house-handler.assign
    name: ${self:service}-assign-house
    events:
      - http:
          path: '{id}/house'
          method: put
          cors: true

  # ---- Parent app (family token + X-Student-Id) — literal 'me' before '{id}' ----
  get-me:
    handler: student-me-handler.getMe
    name: ${self:service}-get-me
    events:
      - http:
          path: me
          method: get
          cors: true

  # ---- Student detail / update / delete (param routes last) ----
  get-student:
    handler: student-admin-handler.getById
    name: ${self:service}-get-student
    events:
      - http:
          path: '{id}'
          method: get
          cors: true

  update-student:
    handler: student-admin-handler.update
    name: ${self:service}-update-student
    events:
      - http:
          path: '{id}'
          method: put
          cors: true

  delete-student:
    handler: student-admin-handler.remove
    name: ${self:service}-delete-student
    events:
      - http:
          path: '{id}'
          method: delete
          cors: true
