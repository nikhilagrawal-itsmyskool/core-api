          cors: true

  delete-set:
    handler: shop-set-handler.remove
    name: ${self:service}-delete-set
    events:
      - http:
          path: sets/{id}
          method: delete
          cors: true

  # Sales
  create-sale:
    handler: shop-sale-handler.create
    name: ${self:service}-create-sale
    events:
      - http:
          path: sales
          method: post
          cors: true

  list-sales:
    handler: shop-sale-handler.list
    name: ${self:service}-list-sales
    events:
      - http:
          path: sales
          method: get
          cors: true

  get-sale:
    handler: shop-sale-handler.getById
    name: ${self:service}-get-sale
    events:
      - http:
          path: sales/{id}
          method: get
          cors: true
