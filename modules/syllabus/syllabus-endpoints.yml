  # Health check
  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # ── Lookups ───────────────────────────────────────────────────────────────
  get-lookups:
    handler: syllabus-lookup-handler.getLookups
    name: ${self:service}-get-lookups
    events:
      - http:
          path: lookups
          method: get
          cors: true

  get-grades:
    handler: syllabus-lookup-handler.getGrades
    name: ${self:service}-get-grades
    events:
      - http:
          path: grades
          method: get
          cors: true

  get-streams:
    handler: syllabus-lookup-handler.getStreams
    name: ${self:service}-get-streams
    events:
      - http:
          path: streams
          method: get
          cors: true

  # ── Subjects ──────────────────────────────────────────────────────────────
  create-subject:
    handler: syllabus-subject-handler.create
    name: ${self:service}-create-subject
    events:
      - http:
          path: subjects
          method: post
          cors: true

  list-subjects:
    handler: syllabus-subject-handler.list
    name: ${self:service}-list-subjects
    events:
      - http:
          path: subjects
          method: get
          cors: true

  get-subject:
    handler: syllabus-subject-handler.getById
    name: ${self:service}-get-subject
    events:
      - http:
          path: subjects/{id}
          method: get
          cors: true

  update-subject:
    handler: syllabus-subject-handler.update
    name: ${self:service}-update-subject
    events:
      - http:
          path: subjects/{id}
          method: put
          cors: true

  delete-subject:
    handler: syllabus-subject-handler.remove
    name: ${self:service}-delete-subject
    events:
      - http:
          path: subjects/{id}
          method: delete
          cors: true

  # ── Plans ─────────────────────────────────────────────────────────────────
  create-syllabus:
    handler: syllabus-plan-handler.create
    name: ${self:service}-create-syllabus
    events:
      - http:
          path: syllabi
          method: post
          cors: true

  list-syllabi:
    handler: syllabus-plan-handler.list
    name: ${self:service}-list-syllabi
    events:
      - http:
          path: syllabi
          method: get
          cors: true

  get-syllabus:
    handler: syllabus-plan-handler.getById
    name: ${self:service}-get-syllabus
    events:
      - http:
          path: syllabi/{id}
          method: get
          cors: true

  get-syllabus-source:
    handler: syllabus-plan-handler.getSource
    name: ${self:service}-get-syllabus-source
    events:
      - http:
          path: syllabi/{id}/source
          method: get
          cors: true

  update-syllabus:
    handler: syllabus-plan-handler.update
    name: ${self:service}-update-syllabus
    events:
      - http:
          path: syllabi/{id}
          method: put
          cors: true

  delete-syllabus:
    handler: syllabus-plan-handler.remove
    name: ${self:service}-delete-syllabus
    events:
      - http:
          path: syllabi/{id}
          method: delete
          cors: true

  # ── Entries ───────────────────────────────────────────────────────────────
  add-entry:
    handler: syllabus-plan-handler.addEntry
    name: ${self:service}-add-entry
    events:
      - http:
          path: syllabi/{id}/entries
          method: post
          cors: true

  bulk-entries:
    handler: syllabus-plan-handler.bulkEntries
    name: ${self:service}-bulk-entries
    events:
      - http:
          path: syllabi/{id}/entries/bulk
          method: post
          cors: true

  reorder-entries:
    handler: syllabus-plan-handler.reorderEntries
    name: ${self:service}-reorder-entries
    events:
      - http:
          path: syllabi/{id}/entries/order
          method: put
          cors: true

  update-entry:
    handler: syllabus-plan-handler.updateEntry
    name: ${self:service}-update-entry
    events:
      - http:
          path: entries/{id}
          method: put
          cors: true

  delete-entry:
    handler: syllabus-plan-handler.removeEntry
    name: ${self:service}-delete-entry
    events:
      - http:
          path: entries/{id}
          method: delete
          cors: true

  # ── Progress (teacher) ────────────────────────────────────────────────────
  progress-roster:
    handler: syllabus-progress-handler.getRoster
    name: ${self:service}-progress-roster
    events:
      - http:
          path: syllabi/{id}/progress
          method: get
          cors: true

  mark-progress:
    handler: syllabus-progress-handler.mark
    name: ${self:service}-mark-progress
    events:
      - http:
          path: progress
          method: post
          cors: true

  mark-progress-bulk:
    handler: syllabus-progress-handler.markBulk
    name: ${self:service}-mark-progress-bulk
    events:
      - http:
          path: progress/bulk
          method: post
          cors: true

  # ── Plan ↔ teacher assignment (per section) ───────────────────────────────
  # Bulk: all assignments for a whole grade in one request (Offerings matrix).
  # Must be declared before syllabi/{id}/teachers so the literal path wins.
  list-grade-teachers:
    handler: syllabus-teacher-handler.listForScope
    name: ${self:service}-list-grade-teachers
    events:
      - http:
          path: plan-teachers
          method: get
          cors: true

  list-plan-teachers:
    handler: syllabus-teacher-handler.list
    name: ${self:service}-list-plan-teachers
    events:
      - http:
          path: syllabi/{id}/teachers
          method: get
          cors: true

  plan-teacher-suggestions:
    handler: syllabus-teacher-handler.suggest
    name: ${self:service}-plan-teacher-suggestions
    events:
      - http:
          path: syllabi/{id}/teacher-suggestions
          method: get
          cors: true

  assign-plan-teacher:
    handler: syllabus-teacher-handler.assign
    name: ${self:service}-assign-plan-teacher
    events:
      - http:
          path: syllabi/{id}/teachers
          method: post
          cors: true

  unassign-plan-teacher:
    handler: syllabus-teacher-handler.unassign
    name: ${self:service}-unassign-plan-teacher
    events:
      - http:
          path: teachers/{id}
          method: delete
          cors: true

  # ── Teacher PWA: my assigned plans ────────────────────────────────────────
  my-plans:
    handler: syllabus-teacher-handler.myPlans
    name: ${self:service}-my-plans
    events:
      - http:
          path: my-plans
          method: get
          cors: true

  # ── Student/parent app (family token + X-Student-Id) ──────────────────────
  my-timeline:
    handler: syllabus-me-handler.timeline
    name: ${self:service}-my-timeline
    events:
      - http:
          path: me/timeline
          method: get
          cors: true

  # ── Model papers (admin/teacher) ──────────────────────────────────────────
  list-model-papers:
    handler: syllabus-model-paper-handler.list
    name: ${self:service}-list-model-papers
    events:
      - http:
          path: model-papers
          method: get
          cors: true

  upload-model-paper:
    handler: syllabus-model-paper-handler.upload
    name: ${self:service}-upload-model-paper
    events:
      - http:
          path: model-papers/upload
          method: post
          cors: true

  set-model-paper-answer-key:
    handler: syllabus-model-paper-handler.setAnswerKey
    name: ${self:service}-set-model-paper-answer-key
    events:
      - http:
          path: model-papers/{id}/answer-key
          method: put
          cors: true

  delete-model-paper-doc:
    handler: syllabus-model-paper-handler.deleteDoc
    name: ${self:service}-delete-model-paper-doc
    events:
      - http:
          path: model-papers/docs/{id}
          method: delete
          cors: true

  delete-model-paper:
    handler: syllabus-model-paper-handler.deletePaper
    name: ${self:service}-delete-model-paper
    events:
      - http:
          path: model-papers/{id}
          method: delete
          cors: true

  download-model-paper-staff:
    handler: syllabus-model-paper-handler.downloadStaff
    name: ${self:service}-download-model-paper-staff
    events:
      - http:
          path: model-papers/docs/{id}/file
          method: get
          cors: true

  # ── Model papers (teacher PWA — scoped to assigned subjects) ───────────────
  teacher-papers:
    handler: syllabus-model-paper-handler.teacherPapers
    name: ${self:service}-teacher-papers
    events:
      - http:
          path: my-papers
          method: get
          cors: true

  # ── Model papers (student/parent app) ─────────────────────────────────────
  my-papers:
    handler: syllabus-model-paper-handler.myPapers
    name: ${self:service}-my-papers
    events:
      - http:
          path: me/papers
          method: get
          cors: true

  download-model-paper-student:
    handler: syllabus-model-paper-handler.downloadStudent
    name: ${self:service}-download-model-paper-student
    events:
      - http:
          path: me/papers/docs/{id}/file
          method: get
          cors: true

  # ── Model-paper PDF conversion worker (docx -> pdf) ────────────────────────
  # HTTP entrypoint for the local poller (scripts/local/syllabus-conversion-worker.js).
  process-next-conversion:
    handler: syllabus-model-paper-handler.processNext
    name: ${self:service}-process-next-conversion
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:1
    events:
      - http:
          path: model-papers/process-next
          method: post
          cors: true

  # AWS worker: EventBridge drains pending docs to PDF every minute. Enabled once the
  # runtime self-test passed and SYLLABUS_CONVERT_ENABLED=true (2026-07-28).
  # Overlap-safe via `for update skip locked`; inert if the flag is ever turned off.
  drain-conversions:
    handler: syllabus-model-paper-handler.drain
    name: ${self:service}-drain-conversions
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:1
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true

  # Invoke-only runtime check for the LibreOffice layer (AL2 binary on AL2023).
  # Run: serverless invoke -f convert-selftest --stage prod --region ap-south-1
  convert-selftest:
    handler: syllabus-model-paper-handler.selftest
    name: ${self:service}-convert-selftest
    timeout: 120
    memorySize: 2048
    ephemeralStorage: 2048
    layers:
      - arn:aws:lambda:ap-south-1:264318271546:layer:prod-itsmyskool-libreoffice:1
