provider:
  name: aws
  runtime: nodejs22.x
  # API Gateway access logging removed: it forces SF's CustomApiGatewayAccountCloudWatchRole
  # custom resource, which fails on this account. The account-level CloudWatch role is
  # managed in IaC (live/prod/apigateway-account) instead; re-add per-stage access logging
  # via IaC later if needed. Lambda execution logs still go to CloudWatch regardless.
  tracing:
    apiGateway: false
    lambda: false
  region: ap-south-1
  stage: ${opt:stage, 'prod'}
  memorySize: 160
  logRetentionInDays: 7
  timeout: 10
  versionFunctions: false
  apiGateway:
    minimumCompressionSize: 1024
    shouldStartNameWithService: true
  stackName: ${self:service}
  # Use a single shared execution role (managed in IaC: live/prod/lambda-execution-role)
  # instead of a Serverless-generated per-service role. The generated role's per-function
  # inline policy exceeds IAM's 10 KB limit on modules with many functions (library,
  # timetable). This role grants the same SNS/S3/SQS + CloudWatch Logs permissions.
  iam:
    role: arn:aws:iam::264318271546:role/prod-itsmyskool-lambda-execution
  package:
    excludeDevDependencies: true
    exclude:
      - .git/**
      - .vscode/**
      - .test/**
      - tests/**

custom:
  # Shared API authorizer (verify-token Lambda in the auth stack). Available to every
  # module, but only enforced where the `../../plugins/serverless-authorizer.js` plugin
  # is added to the module's `plugins:` list (staged, module-by-module rollout).
  authorizer:
    arn: arn:aws:lambda:ap-south-1:264318271546:function:${self:provider.stage}-itsmyskool-auth-service-verify-token
    exemptPaths:
      - health
  customDomains:
    - rest:
        domainName: api-prod.itsmyskool.com
        certificateName: api-prod.itsmyskool.com   # edge domain -> cert looked up in us-east-1
        createRoute53Record: false                 # DNS is on Cloudflare; add the CNAME manually
        securityPolicy: tls_1_2
        basePath: 'sample'
  webpack:
    webpackConfig: '../../webpack.config.js'
    includeModules:
      packagePath: '../../package.json'
      forceExclude:
        - aws-sdk
    packager: 'npm'
    excludeFiles: '.test/**'
    keepOutputDirectory: true
  package:
    individually: true
  serverless-offline:
    host: '0.0.0.0'
    port: 6001

resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: 'ApiGatewayRestApi'

    GatewayResponseDefault5XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: 'ApiGatewayRestApi'
