          cors: true

  me-list-applications:
    handler: leave-me-handler.listApplications
    name: ${self:service}-me-list-applications
    events:
      - http:
          path: me/applications
          method: get
          cors: true

  me-attendance:
    handler: leave-me-handler.attendance
    name: ${self:service}-me-attendance
    events:
      - http:
          path: me/attendance
          method: get
          cors: true

  me-deductions:
    handler: leave-me-handler.deductions
    name: ${self:service}-me-deductions
    events:
      - http:
          path: me/deductions
          method: get
          cors: true

  me-apply:
    handler: leave-me-handler.apply
    name: ${self:service}-me-apply
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/applications
          method: post
          cors: true

  me-cancel:
    handler: leave-me-handler.cancel
    name: ${self:service}-me-cancel
    events:
      - http:
          path: me/applications/{id}/cancel
          method: post
          cors: true

  me-get-attachment:
    handler: leave-me-handler.getAttachment
    name: ${self:service}-me-get-attachment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/applications/{id}/attachment
          method: get
          cors: true
