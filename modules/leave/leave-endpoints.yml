    name: ${self:service}-employee-attendance
    events:
      - http:
          path: employees/{id}/attendance
          method: get
          cors: true

  day-view:
    handler: leave-attendance-handler.dayView
    name: ${self:service}-day-view
    events:
      - http:
          path: day
          method: get
          cors: true

  # ── Deductions (phase 3): monthly ladder run + finalize + per-employee ───────
  deductions-run:
    handler: leave-deduction-handler.run
    name: ${self:service}-deductions-run
    timeout: 60
    events:
      - http:
          path: deductions/run
          method: post
          cors: true

  deductions-list:
    handler: leave-deduction-handler.list
    name: ${self:service}-deductions-list
    events:
      - http:
          path: deductions
          method: get
          cors: true

  deductions-finalize:
    handler: leave-deduction-handler.finalize
    name: ${self:service}-deductions-finalize
    events:
      - http:
          path: deductions/{id}/finalize
          method: post
          cors: true

  employee-deductions:
    handler: leave-deduction-handler.employeeDeduction
    name: ${self:service}-employee-deductions
    events:
      - http:
          path: employees/{id}/deductions
          method: get
          cors: true

  # ── Teacher / office-staff PWA (employee bearer token) ──────────────────────
