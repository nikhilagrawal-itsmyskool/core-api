  # Health check
  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # ── Admin / office (X-School-Code + JWT) ───────────────────────────────────
  get-config:
    handler: leave-handler.getConfig
    name: ${self:service}-get-config
    events:
      - http:
          path: config
          method: get
          cors: true

  list-types:
    handler: leave-handler.listTypes
    name: ${self:service}-list-types
    events:
      - http:
          path: types
          method: get
          cors: true

  list-applications:
    handler: leave-handler.listApplications
    name: ${self:service}-list-applications
    events:
      - http:
          path: applications
          method: get
          cors: true

  get-application:
    handler: leave-handler.getApplication
    name: ${self:service}-get-application
    events:
      - http:
          path: applications/{id}
          method: get
          cors: true

  approve-application:
    handler: leave-handler.approve
    name: ${self:service}-approve-application
    events:
      - http:
          path: applications/{id}/approve
          method: post
          cors: true

  reject-application:
    handler: leave-handler.reject
    name: ${self:service}-reject-application
    events:
      - http:
          path: applications/{id}/reject
          method: post
          cors: true

  get-attachment:
    handler: leave-handler.getAttachment
    name: ${self:service}-get-attachment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: applications/{id}/attachment
          method: get
          cors: true

  get-audit:
    handler: leave-handler.getAudit
    name: ${self:service}-get-audit
    events:
      - http:
          path: applications/{id}/audit
          method: get
          cors: true

  balance:
    handler: leave-handler.balance
    name: ${self:service}-balance
    events:
      - http:
          path: balance
          method: get
          cors: true

  # ── Attendance (phase 2): reconciled views + manual mark + biometric import ──
  attendance-mark:
    handler: leave-attendance-handler.mark
    name: ${self:service}-attendance-mark
    events:
      - http:
          path: attendance/mark
          method: post
          cors: true

  attendance-import:
    handler: leave-attendance-handler.importFile
    name: ${self:service}-attendance-import
    memorySize: 1024
    timeout: 60
    events:
      - http:
          path: attendance/import
          method: post
          cors: true

  attendance-import-timewatch:
    handler: leave-attendance-handler.importTimewatch
    name: ${self:service}-attendance-import-timewatch
    memorySize: 1024
    timeout: 120
    events:
      - http:
          path: attendance/import-timewatch
          method: post
          cors: true

  attendance-map-list:
    handler: leave-attendance-handler.listMap
    name: ${self:service}-attendance-map-list
    events:
      - http:
          path: attendance/map
          method: get
          cors: true

  attendance-map-set:
    handler: leave-attendance-handler.mapEnroll
    name: ${self:service}-attendance-map-set
    events:
