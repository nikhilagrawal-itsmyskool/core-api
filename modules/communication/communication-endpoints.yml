  # Health check
  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # Lookup endpoints
  get-channels:
    handler: communication-lookup-handler.getChannels
    name: ${self:service}-get-channels
    events:
      - http:
          path: lookups/channels
          method: get
          cors: true

  # Auto-injected per-recipient variables (by audience type + union). The Compose
  # UI subtracts these from a template's `variables` to decide which values to prompt.
  get-variables:
    handler: communication-lookup-handler.getVariables
    name: ${self:service}-get-variables
    events:
      - http:
          path: lookups/variables
          method: get
          cors: true

  # Template endpoints
  list-templates:
    handler: template-handler.list
    name: ${self:service}-list-templates
    events:
      - http:
          path: templates
          method: get
          cors: true

  create-template:
    handler: template-handler.create
    name: ${self:service}-create-template
    events:
      - http:
          path: templates
          method: post
          cors: true

  get-template:
    handler: template-handler.getById
    name: ${self:service}-get-template
    events:
      - http:
          path: templates/{id}
          method: get
          cors: true

  update-template:
    handler: template-handler.update
    name: ${self:service}-update-template
    events:
      - http:
          path: templates/{id}
          method: put
          cors: true

  delete-template:
    handler: template-handler.remove
    name: ${self:service}-delete-template
    events:
      - http:
          path: templates/{id}
          method: delete
          cors: true

  restore-template:
    handler: template-handler.restore
    name: ${self:service}-restore-template
    events:
      - http:
          path: templates/{id}/restore
          method: post
          cors: true

  # Message (send) endpoints
  send-message:
    handler: message-handler.send
    name: ${self:service}-send-message
    events:
      - http:
          path: messages
          method: post
          cors: true

  preview-message:
    handler: message-handler.preview
    name: ${self:service}-preview-message
    events:
      - http:
          path: messages/preview
          method: post
          cors: true

  list-messages:
    handler: message-handler.list
    name: ${self:service}-list-messages
    events:
      - http:
          path: messages
          method: get
          cors: true

  # Internal: claim and process one due job. Called by the worker poller /
  # EventBridge on AWS. Resolves the audience + sends, so it needs a longer
  # timeout than the default 10s.
  process-next-message:
    handler: message-handler.processNext
    name: ${self:service}-process-next-message
    timeout: 120
    events:
      - http:
          path: messages/process-next
          method: post
          cors: true

  # The AWS "worker": an EventBridge schedule drains the queue every minute,
  # looping processNext until empty or ~50s spent. Replaces the local Node poller
  # (scripts/local/communication-worker.js) in deployed stages. Correctness under
  # overlapping ticks is guaranteed by `for update skip locked`; the drain is also
  # time-boxed under its timeout and exits when the queue is empty, so overlaps are
  # unlikely and harmless. (No reservedConcurrency: it would drop the account's
  # unreserved concurrency pool below AWS's minimum of 10.)
  drain-messages:
    handler: message-handler.drain
    name: ${self:service}-drain-messages
    timeout: 60
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true

  get-message:
    handler: message-handler.getById
    name: ${self:service}-get-message
    events:
      - http:
          path: messages/{id}
          method: get
          cors: true

  cancel-message:
    handler: message-handler.cancel
    name: ${self:service}-cancel-message
    events:
      - http:
          path: messages/{id}/cancel
          method: post
          cors: true

  # Provider delivery-status callback (authenticated by a provider secret, not the user JWT).
  provider-webhook:
    handler: message-handler.webhook
    name: ${self:service}-provider-webhook
    events:
      - http:
          path: webhooks/{provider}
          method: post
          cors: true
