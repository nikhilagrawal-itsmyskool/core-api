  # Health check
  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  # ── Office / director surface (X-School-Code + JWT) ─────────────────────────
  # Record (+ evidence attachments) and the director list at the module root.
  record:
    handler: feedback-handler.record
    name: ${self:service}-record
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: ''
          method: post
          cors: true

  list:
    handler: feedback-handler.list
    name: ${self:service}-list
    events:
      - http:
          path: ''
          method: get
          cors: true

  # Literal GETs declared before {id} so the literal path wins over the matcher.
  list-categories:
    handler: feedback-handler.listCategories
    name: ${self:service}-list-categories
    events:
      - http:
          path: categories
          method: get
          cors: true

  summary:
    handler: feedback-handler.summary
    name: ${self:service}-summary
    events:
      - http:
          path: summary
          method: get
          cors: true

  grouped:
    handler: feedback-handler.grouped
    name: ${self:service}-grouped
    events:
      - http:
          path: grouped
          method: get
          cors: true

  # ── Teacher PWA surface (employee bearer token) — declared before {id} ──────
  me-list:
    handler: feedback-me-handler.list
    name: ${self:service}-me-list
    events:
      - http:
          path: me
          method: get
          cors: true

  me-get-attachment:
    handler: feedback-me-handler.getAttachment
    name: ${self:service}-me-get-attachment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/attachment/{fileId}
          method: get
          cors: true

  me-get-by-id:
    handler: feedback-me-handler.getById
    name: ${self:service}-me-get-by-id
    events:
      - http:
          path: me/{id}
          method: get
          cors: true

  me-comment:
    handler: feedback-me-handler.comment
    name: ${self:service}-me-comment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/{id}/comment
          method: post
          cors: true

  me-assign:
    handler: feedback-me-handler.assign
    name: ${self:service}-me-assign
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: me/{id}/assign
          method: post
          cors: true

  me-seen:
    handler: feedback-me-handler.seen
    name: ${self:service}-me-seen
    events:
      - http:
          path: me/{id}/seen
          method: post
          cors: true

  # ── {id} matchers (declared last); attachment/{fileId} before {id} ──────────
  get-attachment:
    handler: feedback-handler.getAttachment
    name: ${self:service}-get-attachment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: attachment/{fileId}
          method: get
          cors: true

  get-by-id:
    handler: feedback-handler.getById
    name: ${self:service}-get-by-id
    events:
      - http:
          path: '{id}'
          method: get
          cors: true

  comment:
    handler: feedback-handler.comment
    name: ${self:service}-comment
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: '{id}/comment'
          method: post
          cors: true

  assign:
    handler: feedback-handler.assign
    name: ${self:service}-assign
    memorySize: 512
    timeout: 20
    events:
      - http:
          path: '{id}/assign'
          method: post
          cors: true

  complete:
    handler: feedback-handler.complete
    name: ${self:service}-complete
    events:
      - http:
          path: '{id}/complete'
          method: post
          cors: true

  cancel:
    handler: feedback-handler.cancel
    name: ${self:service}-cancel
    events:
      - http:
          path: '{id}/cancel'
          method: post
          cors: true

  reopen:
    handler: feedback-handler.reopen
    name: ${self:service}-reopen
    events:
      - http:
          path: '{id}/reopen'
          method: post
          cors: true

  seen:
    handler: feedback-handler.seen
    name: ${self:service}-seen
    events:
      - http:
          path: '{id}/seen'
          method: post
          cors: true
