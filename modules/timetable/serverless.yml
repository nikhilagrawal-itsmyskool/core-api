provider:
  name: aws
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  # This service has ~90 functions; a published Lambda Version per function pushes
  # the CloudFormation stack past its 500-resource limit. We don't use versions or
  # aliases (no provisioned concurrency), so drop them to reclaim ~90 resources.
  versionFunctions: false
  environment:
    ${file(../../configs/${self:provider.stage}/${self:provider.stage}.yml)}
  $<<: ${file(../global-config-${self:provider.stage}.yml):provider}

custom:
  prefix: itsmyskool
  baseServiceName: timetable-service
  fullServiceName: ${self:custom.prefix}-${self:custom.baseServiceName}
  customDomain:
   basePath: 'timetable'
  $<<: ${file(../global-config-${self:provider.stage}.yml):custom}

service: ${self:provider.stage}-${self:custom.fullServiceName}
configValidationMode: off

plugins:
  - ../../plugins/serverless-merge-config.js
  - serverless-webpack
  - serverless-offline
  - serverless-domain-manager
  - ../../plugins/serverless-cors-defaults.js

functions: ${file(timetable-endpoints.yml)}

$<<: ${file(../global-config-${self:provider.stage}.yml):resources}
