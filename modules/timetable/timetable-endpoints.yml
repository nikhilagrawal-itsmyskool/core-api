  generate:
    handler: generation-handler.generate
    name: ${self:service}-generate
    events:
      - http:
          path: generate
          method: post
          cors: true
  process-next-run:
    handler: generation-handler.processNext
    name: ${self:service}-process-next-run
    # Generation runs the constraint solver synchronously; it needs far more than the
    # default 10s function timeout. Keep this > SOLVE_TIME_BUDGET_MS in generation-service
    # (300s) with margin for scoring + candidate writes. Whole-school solves are slow but
    # run ~once a term, so a multi-minute synchronous request is acceptable.
    timeout: 360
    events:
      - http:
          path: runs/process-next
          method: post
          cors: true
  # CP-SAT pipeline, stage 1: claim a queued run and dump its SolverInput to the run's
  # artifact folder for the Python solver. No synchronous solve -> default timeout is fine.
  claim-and-dump-run:
    handler: generation-handler.claimAndDump
    name: ${self:service}-claim-and-dump-run
    events:
      - http:
          path: runs/claim-and-dump
          method: post
          cors: true
  # CP-SAT pipeline, stage 3: import a solved run's solution (or failure marker) into the
  # DB via the shared candidate writer. Raised timeout: the entry fan-out writes many rows,
  # which can exceed the default when run against a remote DB (e.g. local offline -> RDS).
  import-solution-run:
    handler: generation-handler.importSolution
    name: ${self:service}-import-solution-run
    timeout: 300
    events:
      - http:
          path: runs/import-solution
          method: post
          cors: true
