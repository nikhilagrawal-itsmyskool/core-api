  verify-token:
    handler: verify-token.auth
    name: ${self:service}-verify-token

  health:
    handler: health-handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  login-employee:
    handler: employee-auth-handler.login
    name: ${self:service}-login-employee
    events:
      - http:
          path: employee/login
          method: post
          cors: true

  login-stuent:
    handler: student-auth-handler.login
    name: ${self:service}-login-student
    events:
      - http:
          path: student/login
          method: post
          cors: true

  change-password-employee:
    handler: employee-password-handler.changePassword
    name: ${self:service}-change-password-employee
    events:
      - http:
          path: employee/change-password
          method: post
          cors: true

  reset-password-employee:
    handler: employee-password-handler.resetPassword
    name: ${self:service}-reset-password-employee
    events:
      - http:
          path: employee/reset-password
          method: post
          cors: true

  change-password-student:
    handler: student-password-handler.changePassword
    name: ${self:service}-change-password-student
    events:
      - http:
          path: student/change-password
          method: post
          cors: true

  recover-request-otp:
    handler: recovery-handler.requestOtp
    name: ${self:service}-recover-request-otp
    events:
      - http:
          path: recover/request-otp
          method: post
          cors: true

  recover-verify-otp:
    handler: recovery-handler.verifyOtp
    name: ${self:service}-recover-verify-otp
    events:
      - http:
          path: recover/verify-otp
          method: post
          cors: true

  recover-set-password:
    handler: recovery-handler.setPassword
    name: ${self:service}-recover-set-password
    events:
      - http:
          path: recover/set-password
          method: post
          cors: true
