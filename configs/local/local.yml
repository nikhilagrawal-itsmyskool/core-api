ENV: local

POSTGRES_ENDPOINT: 'localhost'
POSTGRES_DATABASE: 'itsmyskool_local'
POSTGRES_USERNAME: 'postgres'
POSTGRES_PASSWORD: 'itsmyskool'
POSTGRES_PORT: '5432'
POSTGRES_SSL: 'false'

JWT_SECRET: 'local-dev-secret-key'
JWT_ADMIN_EXPIRY_TIME: '24h'
JWT_STUDENT_EXPIRY_TIME: '7d'

# Forgot-username/password: when 'true', request-otp echoes the OTP back in the
# response so local dev + tests can complete the flow without reading an SMS.
# LOCAL ONLY — never set in prod (would leak codes).
OTP_DEV_ECHO: 'true'

# Communication module: base URL used by other modules (e.g. attendance absence
# alerts) to call its REST endpoints. Locally this points straight at the
# communication module's own http port so it works standalone and under start:all.
COMM_BASE_URL: 'http://localhost:3035'

# Messaging provider. 'stub' logs instead of sending (default for local + tests).
# Flip to 'msg91' and fill the MSG91_* keys below to verify a real send from local.
COMM_PROVIDER: 'stub'
MSG91_AUTH_KEY: ''
MSG91_SMS_SENDER: ''
MSG91_WHATSAPP_NUMBER: ''
MSG91_DEFAULT_COUNTRY_CODE: '91'

# Voice/LLM assistant (modules/assistant). Fill to test the /assistant/ask flow.
ANTHROPIC_API_KEY: ''
